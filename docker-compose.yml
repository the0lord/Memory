# Hosted solmem MCP server.
#   SOLMEM_TOKENS='dev1=alice,dev2=bob' SOLMEM_ADMIN_TOKENS='ops=boss' docker compose up -d
services:
  solmem:
    build: .
    ports:
      # Bind to localhost only — safe default for a shared/prod host. Reach it via
      # your existing reverse proxy (proxy_pass http://127.0.0.1:8730) or an SSH/VPN
      # tunnel. Change to "8730:8730" only if you intend a direct public listener.
      - "127.0.0.1:8730:8730"
    environment:
      # required: per-developer tokens as name=token, comma-separated
      SOLMEM_TOKENS: ${SOLMEM_TOKENS:?set SOLMEM_TOKENS in .env, e.g. 'alice=<token>,bob=<token>'}
      # optional: tokens allowed to evolve / rollback the shared brain
      SOLMEM_ADMIN_TOKENS: ${SOLMEM_ADMIN_TOKENS:-}
      # optional: enables semantic recall (embeddings) server-side
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    volumes:
      - solmem-data:/data        # the shared store; persists across restarts
    restart: unless-stopped

volumes:
  solmem-data:
