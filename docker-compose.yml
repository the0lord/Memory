# Hosted solmem MCP server.
#   SOLMEM_TOKENS='dev1=alice,dev2=bob' SOLMEM_ADMIN_TOKENS='ops=boss' docker compose up -d
services:
  solmem:
    build: .
    ports:
      - "8730:8730"
    environment:
      # required: per-developer tokens (token=author), comma-separated
      SOLMEM_TOKENS: ${SOLMEM_TOKENS:?set SOLMEM_TOKENS, e.g. 'dev1=alice,dev2=bob'}
      # optional: tokens allowed to evolve / rollback the shared brain
      SOLMEM_ADMIN_TOKENS: ${SOLMEM_ADMIN_TOKENS:-}
    volumes:
      - solmem-data:/data        # the shared store; persists across restarts
    restart: unless-stopped

volumes:
  solmem-data:
